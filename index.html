<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日快乐, 李朝祎!</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    
    <style>
        /* CSS 样式 */
        
        body {
            font-family: 'ZCOOL KuaiLe', cursive, sans-serif;
            margin: 0;
            overflow-x: hidden; 
            background: linear-gradient(135deg, #ffc3a0, #ffafbd, #a0c4ff, #b2fefa);
            background-size: 400% 400%;
            background-attachment: fixed;
            animation: gradientAnimation 15s ease infinite;
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 通用容器 */
        .section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
            box-sizing: border-box;
        }

        /* --- 第一屏：贺卡区 --- */
        .birthday-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            padding: 30px 40px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: opacity 1s ease-out, transform 1s ease-out;
            z-index: 10;
        }
        
        .birthday-card.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .pig-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 25px;
            border: 6px solid #fff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            color: #e91e63;
            margin: 10px 0;
            animation: textGlow 2s infinite alternate;
        }

        @keyframes textGlow {
            from { text-shadow: 0 0 10px #fff, 0 0 20px #ff7ac6; }
            to { text-shadow: 0 0 20px #fff, 0 0 40px #f7c6e0; }
        }

        p { font-size: 1.25rem; color: #333; line-height: 1.6; }
        .cake-image { width: 80px; margin-top: 20px; }

        /* 下滑提示箭头 */
        .scroll-down {
            position: absolute;
            bottom: 30px;
            color: #fff;
            font-size: 1.4rem;
            text-align: center;
            animation: bounce 2s infinite;
            cursor: pointer;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
            opacity: 0;
            transition: opacity 1s;
            z-index: 5;
        }
        .scroll-down.show { opacity: 1; }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* --- 第二屏：回忆照片墙 (新添加的部分) --- */
        .memory-text {
            font-size: 1.8rem;
            color: #fff;
            text-align: center;
            margin-bottom: 40px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            opacity: 0; /* 初始隐藏 */
            transform: translateY(20px);
            transition: all 1s ease-out;
        }

        .photo-gallery {
            display: flex;
            flex-direction: column; /* 手机上垂直排列 */
            gap: 30px;
            align-items: center;
        }

        .memory-photo {
            width: 280px; /* 照片宽度 */
            border: 10px solid #fff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            opacity: 0; /* 初始隐藏 */
            transform: translateY(50px) rotate(0deg);
            transition: all 0.8s ease-out;
        }

        /* 让照片稍微歪一点，更有生活感 */
        .memory-photo:nth-child(1) { transform: translateY(50px) rotate(-3deg); }
        .memory-photo:nth-child(2) { transform: translateY(50px) rotate(3deg); }
        .memory-photo:nth-child(3) { transform: translateY(50px) rotate(-2deg); }

        /* 当元素进入视口时添加的类 */
        .visible {
            opacity: 1 !important;
            transform: translateY(0) rotate(0deg) !important; 
        }
        /* 保持旋转效果 */
        .memory-photo.visible:nth-child(1) { transform: translateY(0) rotate(-3deg) !important; }
        .memory-photo.visible:nth-child(2) { transform: translateY(0) rotate(3deg) !important; }
        .memory-photo.visible:nth-child(3) { transform: translateY(0) rotate(-2deg) !important; }


        /* --- 第三屏：视频区 --- */
        .video-wrapper {
            background: rgba(255, 255, 255, 0.85);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        .video-title { font-size: 1.8rem; color: #e91e63; margin-bottom: 20px; }
        video { width: 100%; border-radius: 10px; outline: none; }

        /* 遮罩层与彩带 (保持不变) */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex; justify-content: center; align-items: center;
            z-index: 1001; transition: opacity 0.5s ease;
        }
        #start-button {
            font-family: 'ZCOOL KuaiLe', cursive; font-size: 2rem;
            padding: 20px 40px; background-color: #ff69b4; color: white;
            border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 105, 180, 0.5);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }
        .confetti { position: absolute; width: 10px; height: 20px; opacity: 0.9; animation: fall 7s linear infinite; }
        @keyframes fall { from { transform: translateY(-10vh) rotate(0deg); } to { transform: translateY(110vh) rotate(720deg); } }
    </style>
</head>
<body>
    
    <div id="start-overlay">
        <button id="start-button">🎉 点击开启生日惊喜 🎉</button>
    </div>
    <div id="confetti-container"></div>
    <audio id="birthday-song" src="birthday-music.mp3" loop></audio>

    <div class="section">
        <div class="birthday-card" id="card">
            <img src="pig.jpg" alt="可爱的小猪" class="pig-image">
            <h1>生日快乐，李朝祎！</h1>
            <p>
                祝你每天充满阳光、欢笑和爱！<br>
                今天，你是全世界的主角。
            </p>

        </div>
        
        <div class="scroll-down" id="scroll-hint">
            ⬇️ 下滑的开心小惊喜 ⬇️
        </div>
    </div>

    <div class="section">
        <div class="memory-text scroll-reveal">
            从三月十八号开始，我们相遇<br>
            谢谢你让我陪你这么久 ❤️
        </div>
        
        <div class="photo-gallery">
            <img src="photo1.jpg" class="memory-photo scroll-reveal" alt="我们的回忆1">
            <img src="photo2.jpg" class="memory-photo scroll-reveal" alt="我们的回忆2">
            <img src="photo3.jpg" class="memory-photo scroll-reveal" alt="我们的回忆3">
        </div>
    </div>

    <div class="section">
        <div class="video-wrapper">
            <div class="video-title">🎥 小小的开心舞蹈</div>
            <video id="memory-video" controls playsinline>
                <source src="video.mp4" type="video/mp4">
                你的浏览器不支持视频播放。
            </video>
        </div>
    </div>

    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 元素获取
            const overlay = document.getElementById('start-overlay');
            const startButton = document.getElementById('start-button');
            const audio = document.getElementById('birthday-song');
            const card = document.getElementById('card');
            const scrollHint = document.getElementById('scroll-hint');
            const confettiContainer = document.getElementById('confetti-container');
            const video = document.getElementById('memory-video');
            const scrollElements = document.querySelectorAll('.scroll-reveal'); // 获取所有需要滚动显示的元素

            // 1. 点击开始
            startButton.addEventListener('click', () => {
                overlay.style.opacity = '0';
                setTimeout(() => { overlay.style.display = 'none'; }, 500);
                audio.volume = 0.5;
                audio.play();
                card.classList.add('show');
                setTimeout(() => { scrollHint.classList.add('show'); }, 2000);
                launchConfetti();
            });

            // 2. 滚动显示动画 (监听元素是否进入屏幕)
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible'); // 添加 visible 类来触发动画
                    }
                });
            }, { threshold: 0.2 }); // 当元素显示20%时触发

            scrollElements.forEach((el) => observer.observe(el));

            // 3. 视频播放控制
            video.addEventListener('play', () => audio.pause());
            video.addEventListener('pause', () => audio.play());
            video.addEventListener('ended', () => audio.play());

            // 4. 彩带特效
            const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#03a9f4', '#00bcd4', '#009688', '#4caf50', '#8bc34a', '#cddc39', '#ffeb3b', '#ffc107', '#ff9800'];
            function createConfettiPiece() {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 3 + 4) + 's';
                confetti.style.opacity = Math.random();
                if (Math.random() > 0.5) confetti.style.width = '15px';
                else { confetti.style.height = '15px'; confetti.style.width = '15px'; }
                confettiContainer.appendChild(confetti);
                setTimeout(() => confetti.remove(), 8000);
            }
            function launchConfetti() { setInterval(createConfettiPiece, 200); }
        });
    </script>
</body>
</html>
